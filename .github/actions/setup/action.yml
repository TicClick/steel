name: 'Prepare the project'
description: 'Prepare the project for compilation'

inputs:
  target:
    description: 'Rust target triple'
    required: true
  os:
    required: true
  glass:
    description: 'Glass variant: stub or real (private crate)'
    required: false
    default: 'stub'
  gh-token:
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}

    - name: Install Ubuntu dependencies
      if: ${{ inputs.os == 'ubuntu-latest' }}
      shell: bash
      run: export DEBIAN_FRONTEND=noninteractive && sudo apt update && sudo apt install -y librust-alsa-sys-dev

    - name: Clone real glass dependency
      if: ${{ inputs.glass == 'real' }}
      uses: actions/checkout@v4
      with:
        repository: TicClick/glass
        path: crates/glass
        token: ${{ inputs.gh-token }}

    - name: Use real glass dependency
      if: ${{ inputs.glass == 'real' }}
      shell: bash
      run: |
        cat >> .cargo/config.toml <<'EOF'

        [patch."https://github.com/TicClick/steel"]
        glass = { path = "crates/glass" }
        EOF
        sed -i.bak 's|^members = \[|&"./crates/glass", |' Cargo.toml
        rm Cargo.toml.bak

    - name: Patch private dependencies' URLs
      if: ${{ inputs.glass == 'real' }}
      shell: bash
      run: |
        git config --show-origin --get-regexp '^(url|credential)\.' || true
        git config --global url."https://github.com/".insteadOf ssh://git@github.com/
        git config --global --replace-all credential.https://github.com.helper ''
        git config --global --add credential.https://github.com.helper \
          '!f() { echo username=x-access-token; echo "password=${{ inputs.gh-token }}"; }; f'

    - name: Configure cargo to use git CLI for private repos
      if: ${{ inputs.glass == 'real' }}
      shell: bash
      run: echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $GITHUB_ENV

    - name: Lock the real glass dependency
      if: ${{ inputs.glass == 'real' }}
      shell: bash
      run: cargo update -p glass
